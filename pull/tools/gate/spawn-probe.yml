# gate spawn's probe. Put it on a load branch as a workflow that exists on main (its name and path), dispatch it once
# with label=<superci label> and once with label=<the Blacksmith label it replaces>, reps=[1,2,3], then run spawn.py on
# the two run ids.
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
      reps:
        type: string
        default: "[1,2,3]"
permissions:
  contents: read
jobs:
  spawn:
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(inputs.reps) }}
    runs-on: ${{ inputs.label }}
    steps:
      - name: first exec of the tools a job runs, and fork-exec rate
        run: |
          ms() { local s e; s=$(date +%s%N); "$@" > /dev/null 2>&1; e=$(date +%s%N); echo $(( (e - s) / 1000000 )); }
          echo "runner=${RUNNER_NAME} uptime=$(cut -d' ' -f1 /proc/uptime) nproc=$(nproc) mem=$(free -m | awk '/Mem/{print $2}')"
          node=$(command -v node); py=$(command -v python3); gitb=$(command -v git); dk=$(command -v docker)
          echo "SPAWN node_first=$(ms "$node" -e 0) node_second=$(ms "$node" -e 0) git_first=$(ms "$gitb" --version) python_first=$(ms "$py" -c 0) docker_first=$(ms "$dk" version) bash_first=$(ms bash -c :)"
          s=$(date +%s%N); for i in $(seq 500); do /bin/true; done; e=$(date +%s%N); echo "SPAWN true500=$(( (e - s) / 1000000 ))"
          s=$(date +%s%N); for i in $(seq 50); do "$node" -e 0; done; e=$(date +%s%N); echo "SPAWN node50=$(( (e - s) / 1000000 ))"
          s=$(date +%s%N); find /usr/lib /usr/share -type f -size +100k 2>/dev/null | head -400 | xargs -r cat > /dev/null 2>&1; e=$(date +%s%N); echo "SPAWN coldread400=$(( (e - s) / 1000000 ))"
