name: Deployable build

# Builds the superci CLI with every program it carries (the AWS control plane among them) and keeps it as an artifact,
# so a control plane can be updated from this branch with `superci planes update`. Publishes nothing.
on:
  push:
    branches: [warm-pool-deploy]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo install --locked worker-build@0.8.7
      - run: ./build.sh
      - run: ./target/release/superci --version
      - uses: actions/upload-artifact@v4
        with:
          name: superci-linux-x64
          path: target/release/superci
          retention-days: 7
